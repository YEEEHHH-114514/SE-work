<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>图书馆预约系统</title>
    <link rel="stylesheet" href="css/homeStyle.css">
</head>
<body>
    <div class="page">
        <header>
            <div class="header-left">
                <h1>图书馆座位预约</h1>
                <p>请选择楼层、时间段与座位，并填写姓名与电话完成预约。</p>
            </div>
            <div class="header-right">
                <div>当前用户：<span id="currentUser"></span></div>
                <button id="logoutBtn">退出登录</button>
            </div>
        </header>

        <section class="booking-panel">
            <div class="form-row">
                <label>预约姓名</label>
                <input type="text" id="userName" placeholder="请输入姓名">
            </div>
            <div class="form-row">
                <label>联系电话</label>
                <input type="text" id="phone" placeholder="请输入电话">
            </div>
            <div class="form-row">
                <label>楼层选择</label>
                <select id="floorSelect">
                    <option value="1">一楼</option>
                    <option value="2">二楼</option>
                    <option value="3">三楼</option>
                </select>
            </div>
            <div class="form-row">
                <label>预约日期</label>
                <input type="date" id="dateInput">
            </div>
            <div class="form-row">
                <label>时间段（可多选）</label>
                <div id="timeSlotsContainer" style="flex:1; display:flex; flex-wrap:wrap; gap:8px;">
                    <!-- JS will render hour checkboxes 6:00 - 21:00 -->
                </div>
            </div>
            <div class="form-row">
                <button id="loadSeatsBtn">查询可预约座位</button>
                <button id="submitBookingBtn">提交预约</button>
            </div>
            <div id="messageBox" class="message-box"></div>
            <div class="seat-info" id="seatInfo">请选择楼层、日期和时间段后查询</div>
            <div class="form-row">
                <label>座位类型</label>
                <div id="seatTypeContainer" style="display:flex; gap:8px;"></div>
            </div>
            <div class="seat-grid" id="seatGrid"></div>
        </section>

        <section class="booking-list">
            <h2>我的预约记录</h2>
            <div id="bookingList"></div>
        </section>
    </div>

    <script src="js/homeScript.js"></script>
</body>
</html>
